{% extends 'novels/base.html' %}
{% block content %}
<h2 class="mb-4 fw-bold">♥ My Wishlist</h2>
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    {% for item in wishlist %}
    <div class="col">
        <div class="card shadow-sm novel-tile">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ item.novel.title }}</h5>
                <p class="text-muted small">By {{ item.novel.author.username }}</p>
                <p class="small text-warning fw-bold">⭐ {{ item.novel.average_rating }} / 5</p>
                <div class="d-grid gap-2 mt-auto">
                    <a href="{% url 'read_novel' item.novel.id %}" class="btn btn-primary btn-sm">Read Now</a>
                    <a href="{% url 'toggle_wishlist' item.novel.id %}" class="btn btn-outline-danger btn-sm">Remove</a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p class="text-muted">Your wishlist is empty.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
